<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おままごとペイ">
<meta name="theme-color" content="#ff2d4b">
<title>おままごとペイ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2d4b;--red2:#ff6a3d;--ink:#2b1d1f;--bg:#fff4f1;--card:#fff;--sun:#ffd23f;--mint:#2fc79a;--mute:#9a8486;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fbeeee;--bg:#241719;--card:#33211f;--mute:#c3a9a9}}
:root[data-theme="dark"]{--ink:#fbeeee;--bg:#241719;--card:#33211f;--mute:#c3a9a9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:500}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:4px 16px 22px;border-radius:0 0 22px 22px}
.top h1{margin:0;font-size:13px;font-weight:800;letter-spacing:.04em}
.wallet{margin:-14px 16px 0;background:var(--card);border-radius:28px;padding:20px;box-shadow:0 8px 0 rgba(255,45,75,.18)}
.lbl{font-size:14px;color:var(--mute)}
.bal{font-size:64px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.bal small{font-size:26px;margin-left:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px}
button{font:inherit;border:0;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.big{padding:22px 8px;border-radius:24px;font-size:22px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.pay{background:var(--red)}.chg{background:var(--mint)}
h2{margin:8px 20px;font-size:17px}
.hist{margin:0 16px 24px;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px 16px;border-radius:18px;margin-bottom:8px}
.hist .e{font-size:26px;margin-right:10px}.minus{color:var(--red)}.plus{color:var(--mint)}
.bc{margin:0 16px;width:calc(100% - 32px);background:var(--sun);color:#2b1d1f;padding:18px;border-radius:24px;font-size:20px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.snd{position:absolute;right:12px;top:2px;background:rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:2px 8px;font-size:14px}
.top{position:relative}
.bcard{background:#fff;color:#111;border-radius:24px;padding:20px 16px;text-align:center;box-shadow:0 8px 0 rgba(255,45,75,.18)}
.bcard svg{width:100%;height:120px;display:block}
.bcard .num{margin-top:8px;font-size:20px;font-weight:800;letter-spacing:.12em}
.empty{margin:0 20px;color:var(--mute)}
.page{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.back{align-self:flex-start;background:var(--card);padding:10px 16px;border-radius:999px;font-weight:800}
.shops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shop{background:var(--card);border-radius:18px;padding:10px 2px;font-size:12px;border:3px solid transparent}
.shop span{display:block;font-size:30px}
.shop.on{border-color:var(--red);background:#fff0ee}
@media (prefers-color-scheme:dark){.shop.on{background:#4a2a28}}
.amt{background:var(--card);border-radius:24px;padding:12px 20px;text-align:right;font-size:60px;font-weight:800;min-height:92px;line-height:1.2}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{background:var(--card);border-radius:20px;padding:16px 0;font-size:26px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.keys button:active{transform:translateY(3px)}
.msg{text-align:center;color:var(--red);font-weight:800;min-height:24px}
.done{align-items:center;justify-content:center;text-align:center;gap:10px}
.check{width:140px;height:140px;border-radius:50%;background:var(--mint);color:#fff;font-size:84px;display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.done .d1{font-size:30px;font-weight:800}.done .d2{font-size:40px;font-weight:800}
.stars{font-size:32px;letter-spacing:6px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.check{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SHOPS=[["🍙","おにぎりや"],["🍰","ケーキや"],["🚃","でんしゃ"],["🧸","おもちゃや"],["🍎","くだものや"],["💊","やっきょく"],["📚","ほんや"],["🍜","らーめんや"]];
let S={snd:true,screen:"home",bal:1000,hist:[],shop:0,amt:"",msg:"",last:null};
try{const v=JSON.parse(localStorage.getItem("omPay"));if(v&&typeof v.bal==="number"){S.bal=v.bal;S.hist=v.hist||[]}}catch(e){}
let AC;
function tone(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(v||.25,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}
function bell(f,t,d,v){tone(f,t,d,"sine",v);tone(f*2,t,d*.6,"sine",v*.35);tone(f*3,t,d*.3,"sine",v*.12)}
function sound(k){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 if(k==="scan"){tone(2000,0,.22,"square",.3);tone(4000,0,.22,"sine",.12)}
 else if(k==="pay"){bell(1175,0,.25,.3);bell(1568,.11,.25,.3);bell(1976,.22,.3,.3);bell(2637,.36,1,.32)}
 else if(k==="charge"){bell(1568,0,.3,.28);bell(2093,.12,.7,.3)}
 else if(k==="err"){tone(220,0,.25,"sawtooth",.15)}}catch(e){}}
function barSvg(){let x=0,r="";for(let i=0;i<48;i++){const w=1+Math.floor(Math.random()*3),b=1+Math.floor(Math.random()*2);r+=`<rect x="${x}" y="0" width="${w}" height="100" fill="#111"/>`;x+=w+b}return `<svg viewBox="0 0 ${x} 100" preserveAspectRatio="none" aria-label="バーコード">${r}</svg>`}
function numStr(){let n="";for(let i=0;i<12;i++){n+=Math.floor(Math.random()*10);if(i%4===3&&i<11)n+=" "}return n}
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
 if(!window._sa){const n=2000,u=new Uint8Array(44+n),dv=new DataView(u.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)u[o+i]=t.charCodeAt(i)};
 w(0,"RIFF");dv.setUint32(4,36+n,true);w(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,"data");dv.setUint32(40,n,true);for(let i=0;i<n;i++)u[44+i]=128;
 window._sa=new Audio(URL.createObjectURL(new Blob([u],{type:"audio/wav"})));window._sa.play().catch(()=>{})}}catch(e){}}
document.addEventListener("pointerdown",unlock);
function save(){try{localStorage.setItem("omPay",JSON.stringify({bal:S.bal,hist:S.hist.slice(0,30)}))}catch(e){}}
function scan(){sound("scan");setTimeout(()=>go("pay"),300)}
function toggleSnd(){S.snd=!S.snd;if(S.snd)sound("scan");render()}
function go(s){S.rs=false;S.screen=s;S.amt="";S.msg="";render()}
function key(k){if(k==="←")S.amt=S.amt.slice(0,-1);else if(S.amt.length<5&&!(S.amt===""&&k==="0"))S.amt+=k;S.msg="";render()}
function pick(i){S.shop=i;render()}
function doPay(){const a=+S.amt;if(!a){S.msg="きんがくをいれてね";sound("err");return render()}
 if(a>S.bal){S.msg="おかねがたりないよ。チャージしてね";sound("err");return render()}
 sound("pay");
 S.bal-=a;S.last={a,s:["🛒","おかいもの"]};S.hist.unshift({e:"🛒",n:"おかいもの",a:-a});save();go("done")}
function askCharge(a){S.pending=a;S.screen="chargeConfirm";render()}
function charge(a){sound("charge");S.bal+=a;S.hist.unshift({e:"💰",n:"チャージ",a});save();S.last={a};go("chargeDone")}
function askReset(){S.rs=true;render()}
function noReset(){S.rs=false;render()}
function reset(){S.bal=1000;S.hist=[];S.rs=false;save();go("home")}
const yen=n=>n.toLocaleString("ja-JP");
function render(){
 const el=document.getElementById("app");let h="";
 if(S.screen==="home"){
  h=`<div class="top"><h1>おままごとペイ</h1><button class="snd" onclick="toggleSnd()" aria-label="おと">${S.snd?"🔊":"🔇"}</button></div>
  <div class="wallet"><div class="lbl">いまのおかね</div><div class="bal">${yen(S.bal)}<small>えん</small></div></div>
  <div class="row"><button class="big pay" onclick="go('pay')">はらう</button><button class="big chg" onclick="go('charge')">チャージ</button></div>
  <button class="bc" onclick="go('code')">📱 バーコードをみせる</button>
  <h2>つかったりれき</h2>
  ${S.hist.length?`<ul class="hist">${S.hist.slice(0,8).map(x=>`<li><span><span class="e">${x.e}</span>${x.n}</span><b class="${x.a<0?'minus':'plus'}">${x.a<0?'-':'+'}${yen(Math.abs(x.a))}えん</b></li>`).join("")}</ul>`:`<p class="empty">まだないよ。おかいものしてみよう！</p>`}
  ${S.rs?`<div class="page" style="flex:none;align-items:center"><div class="lbl">おかねとりれきを はじめにもどす？</div><div style="display:flex;gap:10px"><button class="back" onclick="noReset()">やめる</button><button class="back" style="background:var(--red);color:#fff" onclick="reset()">もどす</button></div></div>`:`<p style="text-align:center"><button class="back" style="font-size:13px;font-weight:500" onclick="askReset()">はじめにもどす</button></p>`}`;
 }else if(S.screen==="pay"){
  h=`<div class="page"><button class="back" onclick="go('home')">もどる</button>
  <div class="lbl">いくらはらう？</div>
  <div class="amt">${S.amt?yen(+S.amt):"0"}<small style="font-size:20px"> えん</small></div>
  <div class="msg">${S.msg}</div>
  <div class="keys">${["1","2","3","4","5","6","7","8","9","0","00","←"].map(k=>`<button onclick="key('${k}')" aria-label="${k}">${k}</button>`).join("")}</div>
  <button class="big pay" onclick="doPay()">${S.amt?yen(+S.amt)+"えん ":""}はらう</button></div>`;
 }else if(S.screen==="code"){
  h=`<div class="page"><button class="back" onclick="go('home')">もどる</button>
  <div class="lbl">おみせの人に みせてね</div>
  <div class="bcard">${barSvg()}<div class="num">${numStr()}</div></div>
  <div class="lbl" style="text-align:center">おみせの人は ボタンをおしてね</div>
  <button class="big pay" onclick="scan()">ピッ！よみとる</button></div>`;
 }else if(S.screen==="charge"){
  h=`<div class="page"><button class="back" onclick="go('home')">もどる</button>
  <div class="lbl">いくらチャージする？</div>
  ${[100,500,1000,5000].map(a=>`<button class="big chg" onclick="askCharge(${a})">+ ${yen(a)}えん</button>`).join("")}</div>`;
 }else if(S.screen==="chargeConfirm"){
  h=`<div class="page done"><div class="lbl">チャージのかくにん</div><div class="d2">+${yen(S.pending)}えん</div><div class="wallet" style="width:100%;margin:0"><div class="lbl">チャージごのおかね</div><div class="bal">${yen(S.bal+S.pending)}<small>えん</small></div></div><div class="d1" style="font-size:22px">チャージする？</div><button class="big chg" style="width:100%" onclick="charge(S.pending)">チャージする</button><button class="back" style="align-self:center" onclick="go('charge')">やめる</button></div>`;
 }else if(S.screen==="done"){
  h=`<div class="page done"><div class="check">✓</div><div class="d1">はらったよ！</div><div style="font-size:48px">${S.last.s[0]}</div><div class="lbl">${S.last.s[1]}</div><div class="d2">${yen(S.last.a)}えん</div><div class="stars">⭐⭐⭐</div><div class="lbl">ありがとう！</div><button class="big pay" style="width:100%" onclick="go('home')">おわり</button></div>`;
 }else{
  h=`<div class="page done"><div class="check" style="background:var(--sun)">💰</div><div class="d1">チャージできたよ！</div><div class="d2">+${yen(S.last.a)}えん</div><button class="big chg" style="width:100%" onclick="go('home')">おわり</button></div>`;
 }
 el.innerHTML=h;
}
render();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
